name: TechGuess CI Pipeline

on:
  push:
    branches: [ main, melhorias, testes ]
  pull_request:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Instalar Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Mostrar estrutura do projeto
        run: ls -R

      - name: Validar HTML
        run: |
          echo "Verificando arquivos HTML..."
          find . -name "*.html"

      - name: Validar JavaScript
        run: |
          echo "Verificando arquivos JS..."
          find . -name "*.js"

      - name: Verificar CSS
        run: |
          echo "Verificando arquivos CSS..."
          find . -name "*.css"

      - name: Instalar dependências (se existir package.json)
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "Nenhum package.json encontrado"
          fi

      # PASSO MODIFICADO: Instalar Cypress
      - name: Instalar Cypress
        run: |
          npm install cypress --save-dev

      - name: Simular execução do projeto
        run: |
          echo "Simulando execução do projeto TechGuess..."

      # NOVO PASSO: Executar testes Cypress
      - name: Executar testes Cypress
        run: |
          # Instalar servidor http
          npm install -g http-server
          
          # Iniciar servidor em background para servir o frontend
          http-server ./frontend -p 5500 --silent &
          
          # Aguardar servidor iniciar
          sleep 5
          
          # Executar os testes Cypress
          npx cypress run
          
          # Finalizar servidor
          kill $(lsof -t -i:5500) || true

      - name: Pipeline concluída
        run: echo "Build executado com sucesso 🚀"

      - name: Run tests
        run: npm test