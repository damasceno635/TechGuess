<!DOCTYPE html>
<html>
<head>
  <title>Admin Tech Guess</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Admin - Criar Produto</h1>
  <div class="container">
    <input id="name" placeholder="Nome do produto">
    <input id="image" placeholder="URL da imagem">
    <input id="category" placeholder="Categoria">
    <input id="brand" placeholder="Marca">
    <input id="price" placeholder="Preço">
    <input id="ram" placeholder="RAM">
    <input id="storage" placeholder="Armazenamento">
    <textarea id="description" placeholder="Descrição"></textarea>
    <input id="tags" placeholder="Tags de busca (ex: gaming,camera,estudo)">
    <button onclick="criar()">Criar Produto</button>
  </div>
  <script src="/admin/admin.js"></script>
</body>
</html>
